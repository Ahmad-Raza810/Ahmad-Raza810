<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Catch the Dot | Ahmad Raza</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1020; --panel:#141c31; --text:#eef4ff; --accent:#52d6ff; --pink:#ff6eb4; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; background:radial-gradient(circle at top,#1b2b4c,var(--bg) 65%); color:var(--text); font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; }
    main { width:min(680px,100%); }
    .card { background:rgba(20,28,49,.94); border:1px solid #2a3959; border-radius:22px; padding:24px; box-shadow:0 20px 70px #0006; }
    h1 { margin:0 0 6px; font-size:clamp(1.8rem,5vw,2.5rem); }
    p { color:#b9c8e4; margin:8px 0 18px; }
    .stats { display:flex; flex-wrap:wrap; gap:10px; margin:18px 0; }
    .stat { flex:1; min-width:100px; padding:10px 14px; border-radius:12px; background:#0b1224; border:1px solid #283754; }
    .stat span { display:block; color:#a7b7d4; font-size:.8rem; }
    .stat strong { font-size:1.35rem; }
    #arena { height:330px; position:relative; overflow:hidden; border:1px solid #304365; border-radius:16px; background:linear-gradient(135deg,#101a30,#0c1427); touch-action:manipulation; }
    #target { display:none; position:absolute; width:46px; height:46px; border:0; border-radius:50%; cursor:pointer; background:radial-gradient(circle at 35% 30%,white,var(--accent) 35%,#1874ff 100%); box-shadow:0 0 24px #52d6ff99; }
    #target:focus-visible, button:focus-visible { outline:3px solid var(--pink); outline-offset:3px; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
    button.action { border:0; border-radius:11px; padding:11px 18px; font:inherit; font-weight:700; cursor:pointer; background:var(--accent); color:#07111f; }
    button.secondary { background:#283754; color:var(--text); }
    #message { min-height:1.5em; margin-top:12px; color:#d9e6ff; }
    a { color:var(--accent); }
    @media(max-width:480px) { .card { padding:16px; } #arena { height:300px; } }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>🎯 Catch the Dot</h1>
      <p>Tap or click the glowing dot as many times as you can in 20 seconds. Each successful hit earns one point.</p>
      <div class="stats" aria-live="polite">
        <div class="stat"><span>Score</span><strong id="score">0</strong></div>
        <div class="stat"><span>Time left</span><strong><span id="time" style="display:inline;color:inherit;font-size:1.35rem">20</span>s</strong></div>
        <div class="stat"><span>Best score</span><strong id="best">0</strong></div>
      </div>
      <div id="arena" aria-label="Game area">
        <button id="target" type="button" aria-label="Catch the dot"></button>
      </div>
      <div class="actions">
        <button class="action" id="start" type="button">Start game</button>
        <button class="action secondary" id="reset" type="button">Reset best score</button>
      </div>
      <div id="message" role="status">Ready? Press Start game to play.</div>
      <p><a href="https://github.com/ahmadrazadev875-hue">← Back to Ahmad's GitHub profile</a></p>
    </section>
  </main>
  <script>
    (() => {
      const arena = document.getElementById('arena');
      const target = document.getElementById('target');
      const scoreEl = document.getElementById('score');
      const timeEl = document.getElementById('time');
      const bestEl = document.getElementById('best');
      const message = document.getElementById('message');
      const startBtn = document.getElementById('start');
      const resetBtn = document.getElementById('reset');
      let score = 0;
      let timeLeft = 20;
      let timerId = null;
      let playing = false;
      let best = 0;
      try { best = Number(localStorage.getItem('catchTheDotBest') || 0); } catch (_) { best = 0; }
      bestEl.textContent = String(best);

      function moveTarget() {
        const maxX = Math.max(0, arena.clientWidth - target.offsetWidth);
        const maxY = Math.max(0, arena.clientHeight - target.offsetHeight);
        target.style.left = `${Math.floor(Math.random() * (maxX + 1))}px`;
        target.style.top = `${Math.floor(Math.random() * (maxY + 1))}px`;
      }
      function endGame() {
        playing = false;
        clearInterval(timerId);
        timerId = null;
        target.style.display = 'none';
        startBtn.textContent = 'Play again';
        message.textContent = `Time's up! You scored ${score} point${score === 1 ? '' : 's'}.`;
      }
      function startGame() {
        clearInterval(timerId);
        score = 0;
        timeLeft = 20;
        playing = true;
        scoreEl.textContent = '0';
        timeEl.textContent = '20';
        message.textContent = 'Go! Catch the dot!';
        startBtn.textContent = 'Restart game';
        target.style.display = 'block';
        moveTarget();
        timerId = setInterval(() => {
          timeLeft -= 1;
          timeEl.textContent = String(timeLeft);
          if (timeLeft <= 0) endGame();
        }, 1000);
      }
      target.addEventListener('click', () => {
        if (!playing) return;
        score += 1;
        scoreEl.textContent = String(score);
        if (score > best) {
          best = score;
          bestEl.textContent = String(best);
          try { localStorage.setItem('catchTheDotBest', String(best)); } catch (_) {}
        }
        moveTarget();
      });
      startBtn.addEventListener('click', startGame);
      resetBtn.addEventListener('click', () => {
        best = 0;
        bestEl.textContent = '0';
        try { localStorage.removeItem('catchTheDotBest'); } catch (_) {}
        message.textContent = 'Best score reset.';
      });
      window.addEventListener('resize', () => { if (playing) moveTarget(); });
    })();
  </script>
</body>
</html>
